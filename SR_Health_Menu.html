<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SR Health Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f5e4;--card:#f4fbf0;--ink:#1d4a2c;--sub:#4f7a5c;--accent:#4fa826;--hi:rgba(255,255,255,.9);--lo:rgba(60,110,60,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17261b;--card:#20352a;--ink:#e6f6dc;--sub:#a5c9ab;--hi:rgba(255,255,255,.08);--lo:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#17261b;--card:#20352a;--ink:#e6f6dc;--sub:#a5c9ab;--hi:rgba(255,255,255,.08);--lo:rgba(0,0,0,.5)}
html{scroll-padding-top:150px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-weight:600}
h1,h2,h3,.price,button{font-family:'Baloo 2','Trebuchet MS',sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 110px}
.clay{background:var(--card);border-radius:34px;box-shadow:12px 14px 28px var(--lo),-10px -10px 24px var(--hi),inset -6px -8px 14px rgba(0,0,0,.07),inset 6px 8px 14px var(--hi)}
.btn{border:0;cursor:pointer;color:var(--ink);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:700;font-size:1rem;box-shadow:6px 7px 14px var(--lo),-5px -5px 12px var(--hi),inset -3px -3px 7px rgba(0,0,0,.06),inset 3px 3px 7px var(--hi);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.94);box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.btn.on,.btn.pri{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,.item:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:10px 0;background:var(--bg)}
.bar{display:flex;gap:12px;align-items:center}
.logo{font-size:1.9rem;font-weight:800;margin:0;flex:none;line-height:1}.logo span{color:var(--accent)}
.search{flex:1;min-width:0;border:0;border-radius:999px;padding:12px 20px;font:inherit;color:var(--ink);background:var(--bg);box-shadow:inset 5px 5px 11px var(--lo),inset -5px -5px 11px var(--hi)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 4px 10px;scrollbar-width:none}.chips .btn{flex:none}
.tag{text-align:center;color:var(--sub);margin:6px 0 18px}
section{margin-bottom:30px;padding:24px 20px 28px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.badge{padding:4px 24px;border-radius:999px;font-size:1.7rem;font-weight:800;margin:0;color:#1d3a24;box-shadow:5px 6px 12px var(--lo),inset -3px -4px 8px rgba(0,0,0,.1),inset 3px 4px 8px rgba(255,255,255,.7)}
.head p{margin:0;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.item{border-radius:30px;padding:14px;text-align:center;background:var(--card);box-shadow:8px 10px 20px var(--lo),-6px -6px 16px var(--hi),inset -4px -5px 10px rgba(0,0,0,.05),inset 4px 5px 10px var(--hi)}
.pic{border-radius:24px;overflow:hidden;aspect-ratio:1;background:#fffdf5;box-shadow:inset 4px 5px 10px rgba(0,0,0,.14),inset -3px -3px 8px rgba(255,255,255,.6)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.item h3{margin:10px 0 0;font-size:1.08rem;line-height:1.2}
.note{color:var(--sub);font-size:.85rem;min-height:1.1em}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.price{font-size:1.4rem;font-weight:800}
.qty{display:flex;align-items:center;gap:8px}.qty .btn{padding:2px 13px;font-size:1.2rem}.qty b{min-width:1.2em}
.empty{text-align:center;padding:40px;color:var(--sub)}
.cartbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;padding:13px 28px;font-size:1.1rem;display:none}
.cartbtn.show{display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}.ov.open{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:31;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));display:none;flex-direction:column;border-radius:34px 0 0 34px;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
.drawer.open{display:flex}
.dh{display:flex;justify-content:space-between;align-items:center}.dh h2{margin:0}
.lines{flex:1;overflow:auto;margin:14px 0;display:flex;flex-direction:column;gap:12px;padding:6px}
.line{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:22px;background:var(--card);box-shadow:5px 6px 12px var(--lo),-4px -4px 10px var(--hi)}
.line span:first-child{flex:1;line-height:1.2}
.total{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:800;font-family:'Baloo 2',sans-serif;margin-bottom:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.acts .wa{grid-column:1/-1}
footer{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:22px;color:var(--sub);text-align:center}
footer b{padding:8px 18px;border-radius:999px;background:var(--card);box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi);font-weight:700}
.one .grid,.cake .grid{grid-template-columns:minmax(220px,340px);justify-content:center}
@media(max-width:520px){.logo{font-size:1.4rem}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.item{padding:10px;border-radius:24px}.item h3{font-size:.95rem}.price{font-size:1.2rem}}
@media print{body *{visibility:hidden}.drawer,.drawer *{visibility:visible}.drawer{position:static;box-shadow:none}.acts,.dh .btn,.qty{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<div class="top"><div class="bar"><h1 class="logo">SR <span>Health</span></h1><input class="search" id="q" type="search" placeholder="Search juice, tea, salad…" aria-label="Search menu"><button class="btn" id="th" aria-label="Toggle dark mode">🌙</button></div>
<div class="chips" id="chips"></div></div>
<p class="tag">Fresh Choices · Healthy Life</p>
<main id="menu"></main>
<footer class="clay"><b>100% natural ingredients</b><b>No added preservatives</b><b>Freshly prepared</b><b>Taste you’ll love</b></footer>
</div>
<button class="btn pri cartbtn" id="cb"></button>
<div class="ov" id="ov"></div>
<aside class="drawer" id="dr" aria-label="Your order">
 <div class="dh"><h2>Your order</h2><button class="btn" id="cl">Close</button></div>
 <div class="lines" id="ln"></div>
 <div class="total"><span>Total</span><span id="tt"></span></div>
 <input class="search" id="nm" placeholder="Your name (optional)" aria-label="Your name">
 <div class="acts"><button class="btn" id="cp">Copy bill</button><button class="btn" id="pr">Print bill</button><button class="btn pri wa" id="wa">Order on WhatsApp</button><button class="btn" id="cx" style="grid-column:1/-1">Clear order</button></div>
</aside>
<script>
let D=[],WA_NUMBER='',P={},ST='load';
window.setMenu=m=>{ST='ok';const C=m.cats||{},I=Object.values(m.items||{}),cl=s=>String(s??'').replace(/[<>"]/g,'').trim(),im=u=>/^(data:image\/|https:\/\/)/.test(u||'')?u:'';
WA_NUMBER=String((m.settings||{}).wa||'').replace(/\D/g,'');
D=Object.entries(C).sort((a,b)=>(a[1].order||0)-(b[1].order||0)).map(([id,c])=>({n:cl(c.name),t:cl(c.tag),c:/^#[0-9a-f]{3,8}$/i.test(c.color)?c.color:'#cdeab0',i:I.filter(p=>p.cat==id&&p.active!==false&&cl(p.name)).sort((a,b)=>(a.order||0)-(b.order||0)).map(p=>({name:cl(p.name),price:+p.price||0,img:im(p.img),note:cl(p.note)}))})).filter(s=>s.n&&s.i.length);
P={};D.forEach(s=>s.i.forEach(p=>P[p.name]=p));Object.keys(cart).forEach(k=>{if(!P[k])delete cart[k]});if(cat!='All'&&!D.some(s=>s.n==cat))cat='All';save();chips();menu();drawer()};
window.menuErr=()=>{ST='err';menu()};
const $=i=>document.getElementById(i);
let cart={},cat='All',q='';
try{cart=JSON.parse(localStorage.getItem('srcart')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('srcart',JSON.stringify(cart))}catch(e){}};
const esc=s=>s.replace(/'/g,"&#39;");
function chips(){$('chips').innerHTML=['All',...D.map(s=>s.n)].map(n=>`<button class="btn ${n==cat?'on':''}" data-c="${n}">${n}</button>`).join('')}
function qtyHtml(n){return n?`<div class="qty"><button class="btn" data-m="${esc(n.name)}" aria-label="Remove one">−</button><b>${n.q}</b><button class="btn" data-a="${esc(n.name)}" aria-label="Add one">+</button></div>`:''}
function menu(){
 let h='';
 D.forEach(s=>{
  if(cat!='All'&&cat!=s.n)return;
  const it=s.i.filter(p=>p.name.toLowerCase().includes(q));
  if(!it.length)return;
  h+=`<section class="clay ${it.length==1?'one':''}"><div class="head"><h2 class="badge" style="background:${s.c}">${s.n}</h2><p>${s.t}</p></div><div class="grid">${it.map(p=>{const c=cart[p.name]||0;return `<article class="item"><div class="pic">${p.img?`<img src="${p.img}" alt="${p.name}">`:'<span style="display:grid;place-items:center;height:100%;font-size:3rem">🍹</span>'}</div><h3>${p.name}</h3><div class="note">${p.note?'('+p.note+')':''}</div><div class="row"><span class="price">₹${p.price}</span>${c?qtyHtml({name:p.name,q:c}):`<button class="btn pri" data-a="${esc(p.name)}">Add</button>`}</div></article>`}).join('')}</div></section>`;
 });
 $('menu').innerHTML=h||`<p class="empty clay">${ST=='load'?'Loading menu…':ST=='err'?'Unable to load the menu. Please check your connection and refresh the page.':q?'No items match your search.':'The menu is not available right now. Please check back soon.'}</p>`;
}
function total(){let n=0,t=0;for(const k in cart){n+=cart[k];t+=cart[k]*P[k].price}return[n,t]}
function drawer(){
 const[n,t]=total();
 $('cb').classList.toggle('show',n>0);$('cb').textContent=`View order · ${n} item${n>1?'s':''} · ₹${t}`;
 $('ln').innerHTML=n?Object.keys(cart).map(k=>`<div class="line"><span>${k}<br><small>₹${P[k].price} each</small></span>${qtyHtml({name:k,q:cart[k]})}<b>₹${cart[k]*P[k].price}</b></div>`).join(''):'<p class="empty">Your order is empty. Tap Add on any item.</p>';
 $('tt').textContent='₹'+t;
}
function bill(){
 const[n,t]=total();let s=`*SR Health – Order*\n`;const nm=$('nm').value.trim();if(nm)s+=`Name: ${nm}\n`;
 s+=Object.keys(cart).map(k=>`${cart[k]} x ${k} = ₹${cart[k]*P[k].price}`).join('\n');
 return s+`\n*Total: ₹${t}*`;
}
function ch(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];save();menu();drawer()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.a)ch(b.dataset.a.replace(/&#39;/g,"'"),1);
 else if(b.dataset.m)ch(b.dataset.m.replace(/&#39;/g,"'"),-1);
 else if(b.dataset.c){cat=b.dataset.c;chips();menu()}
});
const open=v=>{$('dr').classList.toggle('open',v);$('ov').classList.toggle('open',v)};
$('cb').onclick=()=>open(true);$('cl').onclick=$('ov').onclick=()=>open(false);
$('q').oninput=e=>{q=e.target.value.toLowerCase().trim();menu()};
$('cx').onclick=()=>{cart={};save();menu();drawer()};
$('pr').onclick=()=>window.print();
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(bill().replace(/\*/g,''));$('cp').textContent='Copied'}catch(e){$('cp').textContent='Copy failed'}setTimeout(()=>$('cp').textContent='Copy bill',1500)};
$('wa').onclick=()=>window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(bill())}`,'_blank');
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';$('th').textContent=d?'🌙':'☀️'};
chips();menu();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const db=getDatabase(initializeApp({apiKey:"AIzaSyCXiHh2MzWv--s3bn7nTRIboyLNePny-t4",authDomain:"sr-fresh-bite-menu.firebaseapp.com",databaseURL:"https://sr-fresh-bite-menu-default-rtdb.firebaseio.com",projectId:"sr-fresh-bite-menu",storageBucket:"sr-fresh-bite-menu.firebasestorage.app",messagingSenderId:"162791363748",appId:"1:162791363748:web:ad98367ca30523c4518231"}));
onValue(ref(db,'menu'),s=>window.setMenu(s.val()||{}),e=>{console.error(e);window.menuErr()});
</script></body></html>
