<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       CSS START (Design aur styling yahan hai)
       ============================================================ */
    :root {
      --bg: #060a18;
      --card: rgba(255, 255, 255, .06);
      --ink: #eef2ff;
      --mut: #9aa6c9;
      --line: rgba(255, 255, 255, .13);
      --acc: #22d3ee;
      --accfg: #031a24;
      --bad: #ff7a90;
      --warn: #fbbf24;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden; letter-spacing: .1px;
    }
    body::before, body::after {
      content: ""; position: fixed; z-index: -1; width: 60vmax; height: 60vmax;
      border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 20s ease-in-out infinite alternate;
    }
    body::before { background: #6d28d9; top: -25vmax; left: -15vmax; }
    body::after { background: #0891b2; bottom: -28vmax; right: -18vmax; animation-delay: -8s; }
    @keyframes drift { to { transform: translate(12vmax, 8vmax) scale(1.15); } }

    .app { display: block; }
    main { max-width: 1100px; margin: 0 auto; animation: flip .55s both; padding: 22px 16px 70px; }
    @keyframes flip { from { opacity: 0; transform: perspective(900px) rotateY(-14deg) translateX(-24px); } }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } }

    .top {
      position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5;
      display: flex; align-items: center; gap: 10px; padding: 10px 16px; margin: 10px 12px 0;
      background: rgba(8, 12, 30, .55); border: 1px solid var(--line); border-radius: 18px;
      backdrop-filter: blur(18px) saturate(160%); box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    .brand {
      font-weight: 800; flex: 1; font-size: 17px;
      background: linear-gradient(90deg, #fde68a, #fb923c); -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    h2 {
      margin: 0 0 18px; font-size: clamp(24px, 4.5vw, 36px); font-weight: 800; letter-spacing: -.5px;
      background: linear-gradient(90deg, #fff, #7dd3fc 60%, #c4b5fd); -webkit-background-clip: text; background-clip: text; color: transparent;
      position: relative; padding-bottom: 12px;
    }
    h2::after {
      content: ""; position: absolute; left: 0; bottom: 0; width: 64px; height: 4px; border-radius: 4px;
      background: linear-gradient(90deg, #22d3ee, #8b5cf6, #f472b6); animation: grow2 .8s both;
    }
    @keyframes grow2 { from { width: 0; } }

    h3 { margin: 18px 0 8px; font-size: 16px; color: #c7d2fe; display: flex; align-items: center; gap: 8px; }
    h3::before { content: ""; width: 4px; height: 16px; border-radius: 3px; background: linear-gradient(#22d3ee, #8b5cf6); }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px;
      backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
      position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s;
    }
    .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, #22d3ee, #8b5cf6, #f472b6); }
    .card:hover { transform: translateY(-4px); box-shadow: 0 14px 24px rgba(0, 0, 0, .4); }
    .card b {
      display: block; font-size: 26px; font-weight: 700;
      background: linear-gradient(90deg, #fff, #a5f3fc); -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: none;
    }
    .card span { color: var(--mut); font-size: 13px; }
    .card.big { border-left: 1px solid var(--line); background: linear-gradient(135deg, rgba(34, 211, 238, .18), rgba(139, 92, 246, .18)); }
    .card b.ok { background: linear-gradient(90deg, #34d399, #bbf7d0); -webkit-background-clip: text; background-clip: text; }
    .card b.bad { background: linear-gradient(90deg, #ff7a90, #fecdd3); -webkit-background-clip: text; background-clip: text; }

    .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
    table { border-collapse: collapse; width: 100%; min-width: 480px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 11.5px; color: #a5b4fc; font-weight: 600; background: rgba(255, 255, 255, .04); text-transform: uppercase; letter-spacing: .6px; position: sticky; top: 0; }
    tr:last-child td { border: 0; }
    tr:nth-child(even) td { background: rgba(255, 255, 255, .025); }
    tr:hover td { background: rgba(34, 211, 238, .09) !important; }
    .r { text-align: right; }
    .bad { color: var(--bad); }
    .ok { color: #34d399; }
    .warn { color: var(--warn); }
    td .ok, td .bad, td .warn { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
    td .ok { background: rgba(52, 211, 153, .14); }
    td .bad { background: rgba(255, 122, 144, .14); }
    td .warn { background: rgba(251, 191, 36, .14); }

    input, select, textarea {
      font: inherit; padding: 0 14px; height: 42px; border: 1px solid var(--line); border-radius: 12px;
      background: rgba(255, 255, 255, .07); color: var(--ink); max-width: 100%;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { border-color: #22d3ee; box-shadow: 0 0 0 3px rgba(34, 211, 238, .25); outline: 0; }
    input::placeholder { color: var(--mut); }
    select option { background: #101935; color: #eef2ff; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }

    .btn {
      font: inherit; font-weight: 600; background: linear-gradient(135deg, #22d3ee, #8b5cf6); color: #fff;
      border: 0; padding: 9px 18px; border-radius: 999px; cursor: pointer; letter-spacing: .2px;
      box-shadow: 0 8px 22px rgba(99, 102, 241, .45); transition: transform .15s, box-shadow .15s, filter .15s;
      background-size: 200% 100%;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.12); background-position: 100% 0; }
    .btn:active { transform: translateY(1px) scale(.98); box-shadow: 0 2px 8px rgba(99, 102, 241, .4); }
    .btn.s { background: rgba(34, 211, 238, .08); color: #67e8f9; border: 1px solid rgba(34, 211, 238, .5); box-shadow: none; padding: 4px 12px; }
    .btn.d { background: rgba(255, 122, 144, .08); color: var(--bad); border: 1px solid rgba(255, 122, 144, .5); border-radius: 999px; padding: 4px 12px; box-shadow: none; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

    /* Login Screen */
    .login {
      max-width: 340px; margin: 12vh auto; padding: 30px; position: relative; overflow: hidden; isolation: isolate;
      border-radius: 24px; border: 0; box-shadow: 0 30px 70px rgba(0, 0, 0, .55), 0 0 60px rgba(139, 92, 246, .25);
      animation: rise .7s both;
    }
    .login::before { content: ""; position: absolute; inset: -60%; z-index: -2; background: conic-gradient(from 0deg, transparent 0 55%, #22d3ee, #8b5cf6, #f472b6, transparent 95%); animation: rot 5s linear infinite; }
    .login::after { content: ""; position: absolute; inset: 2px; border-radius: 22px; background: rgba(9, 14, 34, .94); z-index: -1; }
    @keyframes rot { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(28px) rotateX(-28deg); } }
    .login h2 { text-align: center; font-size: 30px; margin-bottom: 10px; }
    .login h2::after { left: 50%; margin-left: -32px; }
    .login input, .login select { width: 100%; margin-bottom: 10px; }
    .login .btn { width: 100%; padding: 12px; margin-top: 5px; }
    .hint { color: var(--mut); font-size: 13px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 20px; perspective: 900px; margin-top: 14px; }
    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 30px 12px 22px;
      border-radius: 26px; border: 1px solid transparent; background: linear-gradient(rgba(16, 22, 48, .82), rgba(16, 22, 48, .82)) padding-box, linear-gradient(135deg, hsl(var(--h) 90% 68%), rgba(255, 255, 255, .05) 55%, hsl(calc(var(--h) + 60) 90% 62%)) border-box;
      backdrop-filter: blur(14px); box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
      transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .15s ease-out, box-shadow .3s; overflow: hidden;
      font: inherit; color: var(--ink); cursor: pointer; min-height: 190px;
    }
    .tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .22), transparent 60%); opacity: 0; transition: opacity .25s; pointer-events: none; }
    .tile:hover { transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-8px) scale(1.04); box-shadow: 0 28px 55px rgba(0, 0, 0, .55), 0 0 46px hsla(var(--h), 95%, 62%, .38); }
    .tile:hover::before { opacity: 1; }
    .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .16) 50%, transparent 65%); transform: translateX(-120%); pointer-events: none; }
    .tile:hover::after { transform: translateX(120%); transition: transform .9s; }
    .tile .ic {
      font-size: 44px; width: 88px; height: 88px; display: grid; place-items: center; border-radius: 28px;
      background: linear-gradient(150deg, hsl(var(--h) 90% 62%), hsl(calc(var(--h) + 50) 85% 42%));
      box-shadow: 0 14px 26px hsla(var(--h), 90%, 50%, .5), inset 0 3px 0 rgba(255, 255, 255, .5), inset 0 -6px 10px rgba(0, 0, 0, .25);
      animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -350ms); position: relative;
    }
    @keyframes bob { 50% { transform: translateY(-7px) rotate(-3deg); } }
    .tile .ic::before { content: ""; position: absolute; left: 8px; right: 8px; top: 5px; height: 38%; border-radius: 20px 20px 40px 40px; background: linear-gradient(rgba(255, 255, 255, .3), rgba(255, 255, 255, 0)); }
    .tile .ic::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -18px; height: 12px; border-radius: 50%; background: hsla(var(--h), 90%, 50%, .45); filter: blur(8px); }
    .tile b { font-size: 16px; color: #fff; margin-top: 6px; font-weight: 700; letter-spacing: .2px; }
    .tile small { color: var(--mut); }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
      padding: 10px 20px; border-radius: 999px; background: rgba(16, 22, 48, .92); border: 1px solid #22d3ee;
      box-shadow: 0 0 30px rgba(34, 211, 238, .4); animation: pop .4s both; max-width: 90vw;
    }
    @keyframes pop { from { opacity: 0; transform: translate(-50%, 20px) scale(.9); } }

    .modal { position: fixed; inset: 0; background: rgba(3, 6, 18, .7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 9; }
    .modal > div { background: #0f1730; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); padding: 20px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; animation: pop2 .35s both; }
    @keyframes pop2 { from { opacity: 0; transform: scale(.92) translateY(20px); } }

    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 420px; }
    .cal button { aspect-ratio: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; cursor: pointer; font: inherit; position: relative; transition: transform .15s; }
    .cal button:hover { transform: translateY(-3px) scale(1.06); }
    .cal button.dot::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
    .cal button.sel { background: linear-gradient(135deg, #22d3ee, #8b5cf6); outline: 0; }
    .cal i { font-style: normal; text-align: center; color: var(--mut); font-size: 12px; }

    .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 30px; margin: 14px 0; padding: 22px 28px; border-radius: 28px; perspective: 700px; background: linear-gradient(135deg, rgba(34, 211, 238, .14), rgba(139, 92, 246, .16)); border: 1px solid var(--line); backdrop-filter: blur(14px); box-shadow: 0 18px 44px rgba(0, 0, 0, .4); position: relative; overflow: hidden; }
    .hero::before { content: ""; position: absolute; left: -60px; top: -110px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(251, 191, 36, .25), transparent 65%); pointer-events: none; }
    .hero > * { position: relative; }
    .hs span { display: block; color: var(--mut); font-size: 13px; }
    .hs b { font-size: 30px; text-shadow: 0 0 22px rgba(125, 211, 252, .4); font-variant-numeric: tabular-nums; }
    .clk { margin-left: auto; text-align: right; }
    .clk b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
    .clk span { color: var(--mut); font-size: 13px; }
    .coin { position: relative; width: 76px; height: 76px; transform-style: preserve-3d; animation: spin 5s linear infinite; }
    .coin i, .coin::after { content: "₹"; position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; font: 700 40px/1 "Segoe UI", sans-serif; font-style: normal; color: #7c2d12; background: radial-gradient(circle at 30% 28%, #fef3c7, #f59e0b 58%, #b45309); box-shadow: 0 0 30px rgba(251, 191, 36, .55), inset 0 0 0 5px rgba(255, 255, 255, .25), inset 0 0 0 7px rgba(180, 83, 9, .5); backface-visibility: hidden; }
    .coin i { content: none; }
    .coin::after { transform: rotateY(180deg); }
    @keyframes spin { to { transform: rotateY(360deg); } }

    .alert { margin: 0 0 10px; padding: 10px 14px; border-radius: 14px; border: 1px solid rgba(34, 211, 238, .4); background: rgba(34, 211, 238, .08); animation: fade .5s both; }
    .alert.bad { border-color: rgba(255, 122, 144, .5); background: rgba(255, 122, 144, .1); }

    .bars { display: flex; align-items: flex-end; gap: 12px; height: 220px; padding: 18px 16px 12px; perspective: 800px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
    .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
    .bar em { font-style: normal; font-size: 11px; color: var(--mut); white-space: nowrap; }
    .bar span { font-size: 12px; color: var(--mut); }
    .bar i { display: block; width: 100%; max-width: 48px; height: calc(var(--h) - 22%); min-height: 4px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, #67e8f9, #8b5cf6); transform-origin: bottom; transform: rotateX(-10deg) rotateY(-22deg); box-shadow: 9px 0 0 rgba(0, 0, 0, .28), 0 0 26px rgba(34, 211, 238, .45); animation: grow .9s cubic-bezier(.2, .9, .3, 1.2) both; animation-delay: calc(var(--i) * 90ms); }
    @keyframes grow { from { height: 0; } }

    .hbr { display: grid; grid-template-columns: 100px 1fr; gap: 2px 10px; align-items: center; margin: 10px 0; }
    .hbr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbr b { grid-column: 2; font-size: 12px; color: var(--mut); font-weight: 500; }
    .hbr i { display: block; height: 16px; width: var(--w); min-width: 6px; border-radius: 8px; background: linear-gradient(90deg, #22d3ee, #8b5cf6); box-shadow: 0 6px 14px rgba(34, 211, 238, .35), inset 0 2px 0 rgba(255, 255, 255, .4); transform-origin: left; animation: sweep .8s both; animation-delay: calc(var(--i) * 80ms); }
    @keyframes sweep { from { transform: scaleX(0); } }

    .sr { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); font: inherit; padding: 10px 14px; cursor: pointer; }
    .sr:hover { background: rgba(34, 211, 238, .12); }

    .cf { position: fixed; top: 40%; left: 50%; width: 8px; height: 14px; z-index: 30; pointer-events: none; border-radius: 2px; animation: burst 1.4s cubic-bezier(.1, .7, .3, 1) forwards; }
    @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cf { display: none; } }

    * { scrollbar-width: thin; scrollbar-color: #3b4a78 transparent; }

    @media (max-width: 520px) {
      .tiles { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .tile { min-height: 160px; padding: 22px 8px; }
      .tile .ic { width: 72px; height: 72px; font-size: 36px; }
      .hero { gap: 16px; padding: 16px; }
      .clk { margin-left: 0; text-align: left; width: 100%; }
      main { padding: 16px 12px 70px; }
    }
    @media print {
      .toast, nav, .noprint { display: none !important; }
      body { background: #fff; color: #000; }
      body::before, body::after { display: none; }
      h2 { color: #000; background: none; }
      .modal { position: static; background: none; }
      .modal > div { background: #fff; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ============================================================
       JAVASCRIPT START (Logic yahan hai)
       ============================================================ -->
  <script>
    const K = 'shopmgr_v1';
    let S, U = null, tab = '', cart = [], selDate = null, calM = new Date(), lf = '';

    const T = () => new Date().toISOString().slice(0, 10);
    const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = s => document.querySelector(s);
    const v = id => $('#' + id).value.trim();

    function E() {
      return { shops: [], products: [], bills: [], pays: [], rets: [], exp: [], ann: [], closes: [], log: [] };
    }
    function load() { S = E(); }
    function save() { if (window.FB) window.FB.push(); }

    window.G = { get S() { return S; }, set S(v) { S = v; }, get U() { return U; }, set U(v) { U = v; }, get tab() { return tab; }, set tab(v) { tab = v; } };

    function lg(a) {
      S.log.unshift({ ts: Date.now(), t: new Date().toLocaleString('en-IN'), u: U.role == 'admin' ? 'Admin' : U.shop.id, a });
      S.log = S.log.slice(0, 200);
      save();
      toast(a);
    }

    const live = b => b.status != 'cancelled';
    const shop = id => S.shops.find(s => s.id == id) || { name: id };
    const bal = id => S.bills.filter(b => b.shop == id && live(b)).reduce((a, b) => a + b.total - b.paid, 0) - S.pays.filter(p => p.shop == id).reduce((a, p) => a + p.amt, 0) - (S.rets || []).filter(r => r.shop == id).reduce((a, r) => a + r.amt, 0);

    const tbl = (h, rows, empty = 'Nothing here yet.') => `<div class="wrap"><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${rows.length ? rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${h.length}" class="hint">${empty}</td></tr>`}</table></div>`;

    const AT = [['dash', 'Dashboard'], ['cal', 'Business Calendar'], ['shops', 'Shopkeepers'], ['prods', 'Products'], ['bills', 'Sales & Bills'], ['pay', 'Payments'], ['led', 'Ledger'], ['ana', 'Analytics'], ['exp', 'Expenses'], ['ann', 'Announcements'], ['ret', 'Returns'], ['close', 'Daily Closing'], ['set', 'Settings'], ['log', 'Activity Log']];
    const ST = [['bill', 'New Bill'], ['bills', 'Sales History'], ['led', 'My Ledger'], ['ret', 'Returns'], ['rep', 'Daily Report']];

    function render() {
      const R = $('#root');
      if (!U) {
        R.innerHTML = window.AUTHV ? window.AUTHV() : '<div class="login"><h2>Loading…</h2></div>';
        return;
      }
      const IC = {
        dash: ['📊', 'Dashboard', 'Sales ek nazar mein'], cal: ['📅', 'Calendar', 'Date wise hisaab'],
        shops: ['🏪', 'Shopkeepers', 'ID banao / band karo'], prods: ['📦', 'Products', 'Price aur stock'],
        bills: ['🧾', 'Bills', 'Saare bills'], pay: ['💰', 'Payments', 'Paisa aaya / baaki'],
        led: ['📒', 'Ledger', 'Khata'], log: ['🕓', 'Activity', 'Kisne kya kiya'],
        exp: ['💸', 'Expenses', 'Kharcha likho'], ann: ['📢', 'Announcements', 'Sabko message bhejo'],
        ret: ['↩️', 'Returns', 'Maal wapas'], close: ['🔒', 'Daily Closing', 'Din ka hisaab band'],
        set: ['⚙️', 'Settings', 'Business setting'], ana: ['🔥', 'Analytics', 'Kya zyada bik raha hai'],
        bill: ['🛒', 'New Bill', 'Naya bill banao'], rep: ['📈', 'Daily Report', 'Aaj ka hisaab']
      };
      const m = U.role == 'admin' ? AT : ST, home = tab == 'home';

      R.innerHTML = `
        <header class="top noprint">
          ${home ? '' : `<button class="btn" onclick="tab='home';render()">🏠 Home</button>`}
          <span class="brand">🏪 ${U.role == 'admin' ? esc(S.biz || 'Admin') : esc(U.shop.name)}</span>
          <button class="btn s" onclick="out()">Log out</button>

    function view() {
      const a = U.role == 'admin';

        dash, cal: calv, shops: shopsv, prods: prodsv, bills: billsv, pay: payv, led: ledv, exp: expv, ann: annv, ana: anav, ret: retv, close: closev, set: setv,
        log: () => `<h2>Activity Log</h2>` + tbl(['When', 'User', 'Activity'], S.log.map(l => [l.t, l.u, esc(l.a)]))
      })[tab]();
      return ({ bill: billv, bills: billsv, led: ledv, ret: retv, rep: repv })[tab]();
    }

    function range(k) {
      const d = new Date(), t = T(), f = x => { const e = new Date(); e.setDate(e.getDate() - x); return e.toISOString().slice(0, 10); };
      return k == 'today' ? [t, t] : k == '7' ? [f(6), t] : k == '30' ? [f(29), t] : ['0000', '9999'];
    }

    function dash() {
      const k = lf || 'today', [a, b] = range(k),
        bs = S.bills.filter(x => live(x) && x.date >= a && x.date <= b),
        ps = S.pays.filter(p => p.date >= a && p.date <= b),
        sales = bs.reduce((s, x) => s + x.total, 0),
        rec = bs.reduce((s, x) => s + x.paid, 0) + ps.reduce((s, p) => s + p.amt, 0),
        out = S.shops.reduce((s, x) => s + bal(x.id), 0);
      let pq = {};
      bs.forEach(x => x.items.forEach(i => { pq[i.name] = (pq[i.name] || 0) + i.qty }));
      const top = Object.entries(pq).sort((x, y) => y[1] - x[1])[0];

      return `<h2>Dashboard</h2>
        <div class="row">
          <select onchange="lf=this.value;render()">
            ${[['today', 'Today'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['all', 'All time']].map(([v, n]) => `<option value="${v}" ${v == k ? 'selected' : ''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="cards">
          <div class="card big"><span>Total sales</span><b>${fmt(sales)}</b></div>
          <div class="card"><span>Payment received</span><b class="ok">${fmt(rec)}</b></div>
          <div class="card"><span>Total outstanding</span><b class="bad">${fmt(out)}</b></div>
          <div class="card"><span>Active shopkeepers</span><b>${S.shops.filter(s => s.active).length}/${S.shops.length}</b></div>
          <div class="card"><span>Bills</span><b>${bs.length}</b></div>
          <div class="card"><span>Top product</span><b style="font-size:17px">${top ? esc(top[0]) + ' (' + top[1] + ')' : '—'}</b></div>
        </div>
        ${chart7()}
        <h3>Shopkeeper ranking</h3>
        ${tbl(['Rank', 'Shop', 'Sales', 'Bills', 'Pending'],
          S.shops.map(s => ({ s, x: bs.filter(b => b.shop == s.id) }))
            .sort((p, q) => q.x.reduce((a, b) => a + b.total, 0) - p.x.reduce((a, b) => a + b.total, 0))
            .map((o, i) => [['🥇', '🥈', '🥉'][i] || i + 1, esc(o.s.name), fmt(o.x.reduce((a, b) => a + b.total, 0)), o.x.length, `<span class="${bal(o.s.id) > 0 ? 'bad' : ''}">${fmt(bal(o.s.id))}</span>`]))}`;
    }

    function calv() {
      const y = calM.getFullYear(), m = calM.getMonth(), n = new Date(y, m + 1, 0).getDate(), f = new Date(y, m, 1).getDay(), has = new Set(S.bills.map(b => b.date));
      let g = 'SMTWTFS'.split('').map(x => `<i>${x}</i>`).join('') + '<span></span>'.repeat(f);
      for (let d = 1; d <= n; d++) {
        const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        g += `<button class="${has.has(ds) ? 'dot' : ''} ${selDate == ds ? 'sel' : ''}" onclick="selDate='${ds}';render()">${d}</button>`;
      }
      return `<h2>Business Calendar</h2>
        <div class="row">
          <button class="btn s" onclick="calM=new Date(${y},${m - 1},1);render()">‹</button>
          <b>${calM.toLocaleString('en-IN', { month: 'long', year: 'numeric' })}</b>
          <button class="btn s" onclick="calM=new Date(${y},${m + 1},1);render()">›</button>
        </div>

        <p class="hint">Dot = transactions recorded that day.</p>
        ${selDate ? dayrep(selDate) : '<p class="hint">Select a date to see that day’s full report.</p>'}`;
    }

    function dayrep(d) {
      const bs = S.bills.filter(b => b.date == d && live(b)), ps = S.pays.filter(p => p.date == d), sum = (l, f) => l.reduce((a, x) => a + f(x), 0),
        cash = sum(bs.filter(b => b.mode == 'Cash'), b => b.paid) + sum(ps.filter(p => p.mode == 'Cash'), p => p.amt),
        upi = sum(bs.filter(b => b.mode == 'UPI'), b => b.paid) + sum(ps.filter(p => p.mode == 'UPI'), p => p.amt),
        sales = sum(bs, b => b.total), rec = sum(bs, b => b.paid) + sum(ps, p => p.amt),
        units = sum(bs, b => sum(b.items, i => i.qty));
      return `<h3>${d}</h3>
        <div class="cards">
          <div class="card"><span>Sales</span><b>${fmt(sales)}</b></div>
          <div class="card"><span>Received</span><b class="ok">${fmt(rec)}</b></div>
          <div class="card"><span>Cash</span><b>${fmt(cash)}</b></div>
          <div class="card"><span>UPI</span><b>${fmt(upi)}</b></div>
          <div class="card"><span>Bills</span><b>${bs.length}</b></div>

        </div>

        ${tbl(['Shop', 'Sales', 'Pending from bills'],
          S.shops.map(s => {
            const x = bs.filter(b => b.shop == s.id);
            return [esc(s.name), fmt(sum(x, b => b.total)), fmt(sum(x, b => b.total - b.paid))];
          }).filter(r => r[1] != '₹0'), 'No sales on this date.')}`;
    }

    function shopsv() {
      return `<h2>Shopkeepers</h2>
        <div class="row noprint">
          <input id="sn" placeholder="Shop name"><input id="so" placeholder="Owner">
          <input id="sm" placeholder="Mobile"><input id="sc" placeholder="City">

        ${tbl(['Shop ID', 'Shop', 'Owner', 'Username', 'Pending', 'Status', ''],
          S.shops.map(s => [s.id, esc(s.name), esc(s.owner), esc(s.user), fmt(bal(s.id)), s.active ? '<span class="ok">Active</span>' : '<span class="bad">Deactivated</span>', `<button class="btn s" onclick="togShop('${s.id}')">${s.active ? 'Deactivate' : 'Activate'}</button> <button class="btn s" onclick="rstShop('${s.id}')">Reset password</button>`]))}`;
    }

    function addShop() {
      const n = v('sn'), u = v('su'), p = v('sp');

    function togShop(id) {
      const s = shop(id);
      s.active = !s.active;
      lg((s.active ? 'Activated ' : 'Deactivated ') + id);
      render();
    }

    function rstShop(id) {
      const p = prompt('New password (6+ characters)');

      }

    function prodsv() {
      return `<h2>Products</h2>
        <div class="row noprint">
          <input id="pn" placeholder="Product name"><input id="pc" placeholder="Code (optional)">

    function setPrice(id) {

    function addStock(id) {

    }

    function togProd(id) {

    function billv() {
      const q = (lf || '').toLowerCase(), pl = S.products.filter(p => p.active && (p.name + p.code).toLowerCase().includes(q)), tot = cart.reduce((a, i) => a + i.rate * i.qty, 0);
      return `<h2>New Bill</h2>

        <div class="wrap" style="margin-bottom:14px">${tbl(['Product', 'Price (set by Admin)', 'In stock', ''], pl.map(p => [esc(p.name), fmt(p.price) + ' / ' + esc(p.unit), p.stock, p.stock > 0 ? `<button class="btn s" onclick="addCart('${p.id}')">Add</button>` : '<span class="bad">Out of stock</span>']))}</div>
        <h3>Bill items</h3>

        <h3>Grand total: ${fmt(tot)}</h3>

          ${S.disc ? '<input id="dc" type="number" min="0" placeholder="Discount ₹">' : ''}
          <select id="pm"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Credit</option></select>

          <button class="btn" onclick="mkBill()">Generate bill</button>
        </div>
        <div id="err" class="bad"></div>`;

    function addCart(id) {
      const p = S.products.find(x => x.id == id), c = cart.find(i => i.pid == id);
      if (c) c.qty++;
      else cart.push({ pid: id, name: p.name, rate: p.price, qty: 1 });
      render();
    }

    function mkBill() {
      if (!cart.length) return $('#err').textContent = 'Add at least one product.';
      for (const i of cart) {
        if (S.products.find(p => p.id == i.pid).stock < i.qty) return $('#err').textContent = 'Not enough stock for ' + i.name + '.';
      }
      const sub = cart.reduce((a, i) => a + i.rate * i.qty, 0), dc = S.disc ? Math.min(sub, Math.max(0, +v('dc') || 0)) : 0, tot = sub - dc,
        mode = v('pm'), paid = mode == 'Credit' ? 0 : Math.min(tot, Math.max(0, +v('pa') || 0)),
        d = T(), n = S.bills.filter(b => b.date.slice(0, 7) == d.slice(0, 7)).length + 1;
      const b = { id: 'B' + Date.now(), no: `INV-${U.shop.id.slice(5)}-${d.slice(0, 4)}-${d.slice(5, 7)}-${String(n).padStart(4, '0')}`, shop: U.shop.id, date: d, time: new Date().toLocaleTimeString('en-IN'), items: cart.map(i => ({ ...i })), total: tot, disc: dc, paid, mode, cust: v('cn'), status: 'ok' };
      cart.forEach(i => S.products.find(p => p.id == i.pid).stock -= i.qty);
      S.bills.push(b);
      lg('Bill generated: ' + b.no + ' ' + fmt(tot));
      cart = [];
      lf = '';
      render();
      show(b.id);
      confetti();
    }

    function mine() { return U.role == 'admin' ? S.bills : S.bills.filter(b => b.shop == U.shop.id); }

    function billsv() {

    }

    function show(id) {

        <h3 style="margin-top:0">${b.no} ${live(b) ? '' : '<span class="bad">(Cancelled)</span>'}</h3>
        <p class="hint">${esc(shop(b.shop).name)} · ${b.date} ${b.time || ''}${b.cust ? ' · ' + esc(b.cust) : ''}</p>
        ${tbl(['Product', 'Rate', 'Qty', 'Amount'], b.items.map(i => [esc(i.name), fmt(i.rate), i.qty, fmt(i.rate * i.qty)]))}
        <p>${b.disc ? 'Discount ' + fmt(b.disc) + ' · ' : ''}<b>Total ${fmt(b.total)}</b> · Paid ${fmt(b.paid)} (${b.mode}) · Pending ${fmt(b.total - b.paid)}</p>
        ${live(b) ? '' : `<p class="bad">Reason: ${esc(b.reason)}</p>`}
        <div class="row noprint">
          <button class="btn" onclick="window.print()">Print</button>
          <a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(b.no + ' | ' + shop(b.shop).name + ' | Total ' + fmt(b.total) + ' | Paid ' + fmt(b.paid) + ' | Pending ' + fmt(b.total - b.paid))}">WhatsApp</a>
          ${live(b) ? `<button class="btn d" onclick="cancelBill('${b.id}')">Cancel bill</button>` : ''}
          <button class="btn s" onclick="$('#mod').remove()">Close</button>
        </div>
      </div>`;
      document.body.append(m);
    }

    function cancelBill(id) {
      if ((S.bills.find(x => x.id == id) || {}).ret) return alert('Is bill par return ho chuka hai, isliye cancel nahi ho sakta.');
      const r = prompt('Reason for cancelling (required)');
      if (!r) return;
      const b = S.bills.find(x => x.id == id);
      b.status = 'cancelled';
      b.reason = r;
      b.items.forEach(i => {
        const p = S.products.find(x => x.id == i.pid);

      });
      lg('Bill cancelled: ' + b.no + ' — ' + r);
      $('#mod').remove();
      render();
    }

    function payv() {
      return `<h2>Payments & Collection</h2>

      return `<div class="row"><input id="gs" placeholder="🔍 Search: shop, bill no, product, receipt…" oninput="gsearch(this.value)" style="flex:1;min-width:220px"></div>

    function count() {
      document.querySelectorAll('[data-n]').forEach(el => {
        const n = +el.dataset.n, p = el.dataset.p, t0 = performance.now();
        (function f(t) {
          const k = Math.min(1, (t - t0) / 900), x = Math.round(n * (1 - Math.pow(1 - k, 3)));
          el.textContent = p ? x : fmt(x);
          if (k < 1) requestAnimationFrame(f);

    function listen(c, q) {
      subs.push(onValue(q || ref(db, c), s => {
        const arr = Object.values(s.val() || {});
        arr.forEach(it => last[c + '/' + it.id] = cj(it));
        arr.sort((a, b) => a.id < b.id ? -1 : 1);
        if (c == 'log') arr.reverse();
        G.S[c] = arr;
        paint();
      }, e => console.warn(c, e.code)));
    }

    function settings() {
      subs.push(onValue(ref(db, 'settings'), s => {
        const v = s.val() || {};
        Object.assign(G.S, { biz: v.biz, low: v.low, disc: v.disc, hue: v.hue });
        lastSet = cj({ biz: v.biz || '', low: v.low ?? 20, disc: !!v.disc, hue: v.hue || 0 });
        window.hue(v.hue || 0, 1);
        paint();
      }));
    }

    function detach() {
      subs.splice(0).forEach(f => f());
      Object.keys(last).forEach(k => delete last[k]);
      lastSet = '';
    }

    async function proceed(u) {
      detach();
      try {
        const ur = (await get(ref(db, 'users/' + u.uid))).val();
        if (!ur) { MSG = 'Is account ka role nahi mila.'; await signOut(auth); return; }
        
        if (ur.role == 'admin') {
          G.U = { role: 'admin' };
          COLS.forEach(c => c == 'log' ? listen('log', query(ref(db, 'log'), limitToLast(200))) : listen(c));
        } else {
          const id = ur.shop, sh = (await get(ref(db, 'shops/' + id))).val();
          if (!sh || !sh.active) { MSG = 'Ye account deactivate hai. Admin se baat karo.'; await signOut(auth); return; }
          G.U = { role: 'shop', shop: sh };
          subs.push(onValue(ref(db, 'shops/' + id), s => {
            const it = s.val();
            if (!it || !it.active) { signOut(auth); return; }
            last['shops/' + id] = cj(it);
            G.S.shops = [it];
            paint();
          }));
          listen('products'); listen('ann');
          ['bills', 'pays', 'rets'].forEach(c => listen(c, query(ref(db, c), orderByChild('shop'), equalTo(id))));
        }
        settings();
        G.tab = 'home';
        window.render();
      } catch (e) { MSG = why(e); await signOut(auth); }
    }

    onAuthStateChanged(auth, async u => {
      if (setting) return;
      if (!u) {
        detach();
        G.U = null;
        G.S = window.E();
        try {
          AS = (await Promise.race([get(ref(db, 'meta/adminUid')), new Promise((_, r) => setTimeout(() => r({ code: 'auth/network-request-failed' }), 10000))])).exists() ? 'login' : 'setup';
        } catch (e) { AS = 'login'; MSG = why(e); }
        window.render();
        MSG = '';
        return;
      }
      await proceed(u);
    });

    window.setup = async () => {
      const b = $$('sb').value.trim(), u = $$('su').value, p = $$('sp').value;
      if (!b || !u || p.length < 6) return err('Naam, username aur 6+ character password daalo.');
      setting = true;
      let c;
      try {
        try { c = await createUserWithEmailAndPassword(auth, EM(u), p); }
        catch (e) {
          if (e.code == 'auth/email-already-in-use') c = await signInWithEmailAndPassword(auth, EM(u), p);
          else throw e;
        }
        await set(ref(db, 'meta/adminUid'), c.user.uid);
        await set(ref(db, 'users/' + c.user.uid), { role: 'admin' });
        await set(ref(db, 'settings'), { biz: b, low: 20, disc: false, hue: 0 });
        setting = false;
        proceed(c.user);
      } catch (e) { setting = false; err(why(e)); }
    };

    window.out = () => signOut(auth);

    window.FB = {
      push() {
        const S = G.S;
        if (!G.U) return;
        const u = {};
        COLS.forEach(c => (S[c] || []).forEach(it => {
          if (!it.id) it.id = uid();
          const j = cj(it);
          if (last[c + '/' + it.id] !== j) { last[c + '/' + it.id] = j; u[c + '/' + it.id] = JSON.parse(j); }
        }));
        if (G.U.role == 'admin') {
          const t = { biz: S.biz || '', low: S.low ?? 20, disc: !!S.disc, hue: S.hue || 0 }, j = cj(t);
          if (j !== lastSet) { lastSet = j; u.settings = t; }
        }
        if (Object.keys(u).length) update(ref(db), u).catch(e => {
          Object.keys(u).forEach(k => delete last[k]);
          lastSet = '';
          window.toast('Save nahi hua: ' + (e.code || e.message));
        });
      }
    };

    window.addShop = async () => {
      const S = G.S, n = $$('sn').value.trim(), u = clean($$('su').value), p = $$('sp').value, re = $$('se').value.trim(), e = $$('err');
      if (!n || !u || p.length < 6) return e.textContent = 'Shop name, username aur 6+ character password daalo.';
      if (S.shops.some(s => s.user == u)) return e.textContent = 'Ye username pehle se hai.';
      const id = 'SHOP-' + (1001 + S.shops.length), email = re || u + '@shopmgr.app';
      try {
        sec = sec || initializeApp(cfg, 'sec');
        const sa = getAuth(sec), c = await createUserWithEmailAndPassword(sa, email, p);
        await signOut(sa);
        await set(ref(db, 'users/' + c.user.uid), { role: 'shop', shop: id });
        S.shops.push({ id, name: n, owner: $$('so').value.trim(), mobile: $$('sm').value.trim(), city: $$('sc').value.trim(), user: u, email, realEmail: !!re, uid: c.user.uid, active: true });
        window.lg('Shopkeeper created: ' + id);
        window.render();
        alert('Shopkeeper ID ban gayi.\nShop ID: ' + id + '\nLogin: ' + (re || u) + '\nPassword: jo aapne daala');
      } catch (x) { e.textContent = x.code == 'auth/email-already-in-use' ? 'Ye username/email pehle se hai.' : why(x); }
    };

    window.rstShop = async id => {
      const s = G.S.shops.find(x => x.id == id);
      if (s && s.realEmail) {
        try { await sendPasswordResetEmail(auth, s.email); window.toast('Reset email bhej diya'); }
        catch (e) { alert('Fail: ' + e.code); }
      } else alert('Is shopkeeper ka email nahi diya gaya, isliye password yahan se reset nahi ho sakta. Firebase Console > Authentication mein reset kar sakte ho.');
    };

    window.chPw = async () => {
      const p = $$('np').value;
      if (p.length < 6) return err('Kam se kam 6 characters.');
      try { await updatePassword(auth.currentUser, p); window.toast('Password badal gaya'); $$('np').value = ''; }
      catch (e) { err(e.code == 'auth/requires-recent-login' ? 'Log out karke dobara login karo, phir try karo.' : 'Fail: ' + e.code); }
    };

    window.rs = () => alert('Restore yahan se band hai (live database ki suraksha ke liye).');
  </script>
</body>
</html>
